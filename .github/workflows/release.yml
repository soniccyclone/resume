name: Build PDF and cut Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render PDF
        run: make pdf

      - name: Compute release tag
        id: tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHORT=$(git rev-parse --short HEAD)
          echo "tag=v${DATE}-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "name=Resume ${DATE//./-}" >> "$GITHUB_OUTPUT"

      - name: Create release with PDF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            Nathan_Barlow_Resume.pdf \
            --title "${{ steps.tag.outputs.name }}" \
            --target "${{ github.sha }}" \
            --generate-notes
